
name: Build Plugins

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install

      - name: Build plugins
        run: npm run build

      - name: Package plugins
        run: |
          mkdir -p dist/pool
          for plugin in translator discord-rpc; do
            mkdir -p "dist/package-$plugin"
            cp "dist/$plugin/index.js" "dist/package-$plugin/index.js"
            cp "src/plugins/$plugin/manifest.json" "dist/package-$plugin/manifest.json"
            cd "dist/package-$plugin"
            zip -q -r "../pool/$(node -p "const m=require('./manifest.json'); m.id+'@'+m.version").zip" manifest.json index.js
            cd ../..
            rm -rf "package-$plugin"
          done

      - name: Generate repository index
        run: |
          npx --yes @revenge-mod/plugin-cli generate-index \
            --dist dist/pool \
            --base-url https://youssefua2.github.io/ua2-plugins/pool \
            --out dist/index.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
